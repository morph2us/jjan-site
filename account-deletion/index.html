<title>계정 삭제 — 짠 (Jjan)</title>

<link rel="canonical" href="https://jjan.io/delete-account/">
<noscript><meta http-equiv="refresh" content="0; url=/delete-account/"></noscript>
<script>
  // 브라우저 언어에 맞는 삭제 안내로 — 지원 언어 외에는 기본(한국어+영문 요약) 페이지
  (function () {
    var l = ((navigator.languages && navigator.languages[0]) || navigator.language || "").toLowerCase();
    var m = { en: "en/", ja: "ja/", zh: "zh/", es: "es/" }[l.slice(0, 2)] || "";
    location.replace("/delete-account/" + m);
  })();
</script>
