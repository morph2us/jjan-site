<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body {
    font-family: -apple-system, "Apple SD Gothic Neo", sans-serif;
    background: linear-gradient(180deg, #171019 0%, #1F1620 55%, #241A1E 100%);
    color: #F5EEE8;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative;
  }
  .stage { display: flex; flex-direction: column; align-items: center; width: 100%; }
  .report {
    width: 680px; border-radius: 44px; padding: 44px 46px;
    background: rgba(245,238,232,.06); border: 1px solid rgba(245,238,232,.1);
    box-shadow: 0 -40px 120px rgba(130,203,155,.13), 0 30px 80px rgba(0,0,0,.45);
    margin-bottom: 96px; position: relative; overflow: hidden;
  }
  .report::before {
    content: ""; position: absolute; top: -120px; left: 50%; transform: translateX(-50%);
    width: 560px; height: 240px; border-radius: 50%;
    background: radial-gradient(ellipse, rgba(130,203,155,.22), transparent 70%);
  }
  .eyebrow { font-size: 24px; font-weight: 590; color: #F1C68B; position: relative; }
  .r-head { font-size: 44px; font-weight: 700; line-height: 1.35; margin-top: 14px; position: relative; }
  .comment { display: flex; align-items: center; gap: 16px; margin-top: 30px; position: relative; }
  .comment .ic {
    width: 44px; height: 44px; border-radius: 50%; flex: none;
    background: rgba(130,203,155,.2); color: #82CB9B;
    display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700;
  }
  .comment p { font-size: 26px; color: rgba(245,238,232,.75); }
  .hook { font-size: 34px; font-weight: 590; color: rgba(245,238,232,.5); margin-bottom: 24px; }
  h1 { font-size: 80px; font-weight: 700; line-height: 1.3; text-align: center; letter-spacing: -.02em; }
  h1 .em { color: #F1C68B; }
  .sub { margin-top: 36px; font-size: 30px; line-height: 1.65; color: rgba(245,238,232,.6); text-align: center; }
  .foot {
    position: absolute; bottom: 72px; left: 0; right: 0;
    display: flex; justify-content: center; gap: 28px;
    font-size: 26px; color: rgba(245,238,232,.45);
  }
  .foot .brand { color: #F1C68B; font-weight: 700; }
</style>
</head>
<body>
  <div class="stage">
    <div class="report">
      <div class="eyebrow">아침 리포트 · 토요일</div>
      <div class="r-head">어제 그 컨디션이면<br>어디서든 통해요</div>
      <div class="comment">
        <div class="ic">✓</div>
        <p>끝까지 초록불 — 다음에도 이렇게만.</p>
      </div>
    </div>
    <div class="hook">판단하지 않는 친구의 아침 인사</div>
    <h1>어젯밤을 아는 앱이,<br><span class="em">아침도 챙겨요</span></h1>
    <p class="sub">몇 시에 잔이 몰렸는지 짚어주고, 오늘 컨디션을 물어봐요.<br>답할수록 다음 자리를 더 정확히 읽어요.</p>
  </div>
  <div class="foot"><span class="brand">짠 · Jjan</span><span>곧, App Store</span><span>@jjan_app</span></div>
</body>
</html>
