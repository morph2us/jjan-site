<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1600px; height: 900px; overflow: hidden; }
  body {
    font-family: -apple-system, "Apple SD Gothic Neo", sans-serif;
    background: linear-gradient(180deg, #171019 0%, #1F1620 55%, #241A1E 100%);
    color: #F5EEE8;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative;
  }
  .stage { display: flex; flex-direction: column; align-items: center; width: 100%; }
  .call {
    width: 560px; border-radius: 44px; padding: 24px 30px;
    background: rgba(245,238,232,.08); border: 1px solid rgba(245,238,232,.12);
    display: flex; align-items: center; gap: 26px;
    box-shadow: 0 30px 80px rgba(0,0,0,.45);
    margin-bottom: 48px;
  }
  .avatar {
    width: 92px; height: 92px; border-radius: 50%; flex: none;
    background: radial-gradient(circle at 50% 40%, rgba(241,198,139,.6), rgba(241,198,139,.15));
    border: 1.5px solid rgba(241,198,139,.5);
    display: flex; align-items: center; justify-content: center; font-size: 42px;
  }
  .who { flex: 1; }
  .who .label { font-size: 24px; color: rgba(245,238,232,.5); }
  .who .name { font-size: 38px; font-weight: 700; margin-top: 4px; }
  .accept {
    width: 84px; height: 84px; border-radius: 50%; flex: none;
    background: #82CB9B; display: flex; align-items: center; justify-content: center;
    font-size: 38px; color: #14261B;
  }
  .hook { font-size: 27px; font-weight: 590; color: rgba(245,238,232,.5); margin-bottom: 24px; }
  h1 { font-size: 60px; font-weight: 700; line-height: 1.3; text-align: center; letter-spacing: -.02em; }
  h1 .em { color: #F1C68B; }
  .sub { margin-top: 24px; font-size: 25px; line-height: 1.65; color: rgba(245,238,232,.6); text-align: center; }
  .foot {
    position: absolute; bottom: 42px; left: 0; right: 0;
    display: flex; justify-content: center; gap: 28px;
    font-size: 26px; color: rgba(245,238,232,.45);
  }
  .foot .brand { color: #F1C68B; font-weight: 700; }
</style>
</head>
<body>
  <div class="stage">
    <div class="call">
      <div class="avatar">📞</div>
      <div class="who">
        <div class="label">수신 전화</div>
        <div class="name">우리 집</div>
      </div>
      <div class="accept">✓</div>
    </div>
    <div class="hook">자리를 뜨고 싶은데, 타이밍이 없을 때</div>
    <h1>30초 뒤,<br><span class="em">전화가 올 거예요</span></h1>
    <p class="sub">미리 녹음해둔 목소리가 자연스럽게 나갈 이유를 만들어줘요.<br>조용히 빠져나가기 — 짠의 탈출 버튼.</p>
  </div>
  <div class="foot"><span class="brand">짠 · Jjan</span><span>곧, App Store</span><span>@jjan_app</span></div>
</body>
</html>
