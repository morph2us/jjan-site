<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1600px; height: 900px; overflow: hidden; }
  body {
    font-family: -apple-system, "Apple SD Gothic Neo", sans-serif;
    background: linear-gradient(180deg, #171019 0%, #1F1620 55%, #241A1E 100%);
    color: #F5EEE8;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative;
  }
  .stage { display: flex; flex-direction: column; align-items: center; }
  .glow {
    width: 190px; height: 190px; border-radius: 50%;
    background: radial-gradient(circle at 50% 42%, rgba(241,198,139,.55), rgba(241,198,139,.07) 70%);
    border: 2px solid rgba(241,198,139,.6);
    box-shadow: 0 0 140px 30px rgba(241,198,139,.14);
    margin-bottom: 44px;
  }
  .strike { font-size: 40px; font-weight: 590; color: rgba(245,238,232,.4); text-decoration: line-through; text-decoration-color: rgba(216,122,107,.75); text-decoration-thickness: 5px; margin-bottom: 26px; }
  h1 { font-size: 58px; font-weight: 700; line-height: 1.32; text-align: center; letter-spacing: -.02em; }
  h1 .em { color: #F1C68B; }
  .sub { margin-top: 26px; font-size: 25px; line-height: 1.65; color: rgba(245,238,232,.6); text-align: center; }
  .dots { display: flex; gap: 22px; margin-top: 40px; }
  .dots span { width: 22px; height: 22px; border-radius: 50%; }
  .g { background: #82CB9B; } .y { background: #E2BF76; } .r { background: #D87A6B; }
  .foot {
    position: absolute; bottom: 42px; left: 0; right: 0;
    display: flex; justify-content: center; gap: 28px;
    font-size: 26px; color: rgba(245,238,232,.45);
  }
  .foot .brand { color: #F1C68B; font-weight: 700; }
</style>
</head>
<body>
  <div class="stage">
    <div class="glow"></div>
    <div class="strike">잔을 세는 앱</div>
    <h1><span class="em">취기를 아는</span> 앱</h1>
    <p class="sub">의학 연구로 설계한 엔진이 성별·체형·주량·주종까지 반영해<br>지금의 취기를 계산하고, 내일 컨디션까지 챙겨요.</p>
    <div class="dots"><span class="g"></span><span class="y"></span><span class="r"></span></div>
  </div>
  <div class="foot"><span class="brand">짠 · Jjan</span><span>곧, App Store</span><span>@jjan_app</span></div>
</body>
</html>
